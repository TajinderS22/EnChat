name: Deploy on Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Setup Node
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: npm ci

     
      # =========================
      # Build encryption package
      # =========================
      - name: Build encryption package
        run: |
          npm run build --workspace=@repo/encryption

      # =========================
      # Build Next.js
      # =========================
      - name: Build Next.js
        run: |
          cd apps/web
          npm run build

      # =========================
      # Prepare deployment package
      # =========================
      - name: Prepare deployment package
        run: |
          mkdir -p deploy/apps/web

          # Next.js production build
          cp -r apps/web/.next deploy/apps/web/.next

          # Static/public files
          if [ -d "apps/web/public" ]; then
            cp -r apps/web/public deploy/apps/web/public
          fi

          # Next.js package files
          cp apps/web/package.json deploy/apps/web/package.json

          # Root package files
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json

          # Workspace configuration
          cp turbo.json deploy/turbo.json

          # Workspace packages required by the server
          cp -r packages deploy/packages

          # Server applications
          cp -r apps/http-server deploy/apps/http-server
          cp -r apps/websocket deploy/apps/websocket

          # Remove build artifacts from server packages.
          # They will be rebuilt on the VM.
          find deploy/apps/http-server -type d -name dist -prune -exec rm -rf {} +
          find deploy/apps/websocket -type d -name dist -prune -exec rm -rf {} +

          tar -czf deploy.tar.gz -C deploy .

      # =========================
      # Setup SSH
      # =========================
      - name: Setup SSH
        env:
          HOST: ${{ secrets.PROD_HOST }}
          USER: ${{ secrets.PROD_USER }}
          KEY: ${{ secrets.PROD_SSH_KEY }}

        run: |
          echo "$KEY" > key.pem
          chmod 600 key.pem

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName $HOST
            User $USER
            IdentityFile $(pwd)/key.pem
            StrictHostKeyChecking no
          EOF

      # =========================
      # Upload deployment package
      # =========================
      - name: Upload deployment package
        run: |
          scp deploy.tar.gz prod:/tmp/enchat-deploy.tar.gz

      # =========================
      # Deploy on VM
      # =========================
      - name: Deploy on VM
        run: |
          ssh prod <<'EOF'

            set -e

            APP_DIR="/home/ubuntu/EnChat"

            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            nvm use 24

            echo "================================"
            echo "Node version"
            echo "================================"

            node -v
            npm -v

            echo "================================"
            echo "Preparing application"
            echo "================================"

            mkdir -p "$APP_DIR"

            # Preserve production .env
            if [ -f "$APP_DIR/.env" ]; then
              cp "$APP_DIR/.env" /tmp/enchat.env
            fi

            echo "Removing old application files..."

            find "$APP_DIR" -mindepth 1 -maxdepth 1 \
              ! -name ".env" \
              -exec rm -rf {} +

            echo "Extracting deployment..."

            tar -xzf /tmp/enchat-deploy.tar.gz -C "$APP_DIR"

            rm -f /tmp/enchat-deploy.tar.gz

            # Restore production .env
            if [ -f /tmp/enchat.env ]; then
              cp /tmp/enchat.env "$APP_DIR/.env"
              rm -f /tmp/enchat.env
            fi

            cd "$APP_DIR"

            echo "================================"
            echo "Installing dependencies"
            echo "================================"

            npm ci

            echo "================================"
            echo "Building encryption package"
            echo "================================"
                    
            cd "$APP_DIR/packages/encryption"
                    
            npx tsc
                    
            echo "================================"
            echo "Generating Prisma client"
            echo "================================"
                    
            cd "$APP_DIR/packages/db"
                    
            npx prisma generate
            npx tsc
                    
            echo "================================"
            echo "Building HTTP server"
            echo "================================"
                    
            cd "$APP_DIR/apps/http-server"
                    
            npx tsc -b
                    
            echo "================================"
            echo "Building WebSocket server"
            echo "================================"
                    
            cd "$APP_DIR/apps/websocket"
                    
            npx tsc -b
                        cd "$APP_DIR"

            echo "================================"
            echo "Restarting PM2"
            echo "================================"

            pm2 restart all

            echo "================================"
            echo "Deployment complete!"
            echo "================================"

          EOF
