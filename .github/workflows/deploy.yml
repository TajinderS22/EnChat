name: Deploy on Production

on:
    push:
        branches:
            - main


jobs:
   deploy:
    runs-on: ubuntu-latest

    steps:
        -   name: Checkout repo
            uses: actions/checkout@v3

        -   name: Setup Nodejs
            uses: actions/setup-node@v3
            with:
                node-version: 22
        -   name: Install Dependencies
            run: pwd && npm install

        -   name: Build The app
            run: npm run build

        -   name: Upload build to server
            env:
              HOST: ${{ secrets.PROD_HOST }}
              USER: ${{ secrets.PROD_USER }}
              KEY: ${{ secrets.PROD_SSH_KEY }}
              TARGET_DIR: /home/azureuser/Enchat
            run: |
                echo "$KEY" > key.pem
                chmod 600 key.pem

               
                rsync -avz --delete -e "ssh -i key.pem -o StrictHostKeyChecking=no" \
                  ./ $USER@$HOST:$TARGET_DIR/
                
                ssh -i key.pem -o StrictHostKeyChecking=no $USER@$HOST "
                  cd $TARGET_DIR
                
                  echo '--- (Server) Installing dependencies ---'
                  npm install
                
                  echo '--- (Server) Running Prisma Generate (if needed) ---'
                  
                  npx prisma generate
                
                  echo '--- (Server) Building app ---'
                  npm run build
                
                  echo '--- (Server) Restarting app CD Test complete ---'
                 
                "
        
        
