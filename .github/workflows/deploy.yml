name: Deploy on Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Setup Node
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: npm ci

      # =========================
      # Prisma
      # =========================
      - name: Generate Prisma client
        run: |
          cd packages/db
          npx prisma generate

      # =========================
      # TypeScript
      # =========================
      - name: Compile DB package
        run: |
          cd packages/db
          npx tsc

      # =========================
      # Build
      # =========================
      - name: Build application
        run: npm run build:force

      # =========================
      # Remove unnecessary files
      # =========================
      - name: Prepare deployment package
        run: |
          rm -rf .git
          rm -rf .github

          tar -czf deploy.tar.gz .

      # =========================
      # Setup SSH
      # =========================
      - name: Setup SSH
        env:
          HOST: ${{ secrets.PROD_HOST }}
          USER: ${{ secrets.PROD_USER }}
          KEY: ${{ secrets.PROD_SSH_KEY }}

        run: |
          echo "$KEY" > key.pem
          chmod 600 key.pem

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName $HOST
            User $USER
            IdentityFile $(pwd)/key.pem
            StrictHostKeyChecking no
          EOF

      # =========================
      # Send build to server
      # =========================
      - name: Upload build
        run: |
          scp deploy.tar.gz prod:/tmp/enchat-deploy.tar.gz

      # =========================
      # Extract on server
      # =========================
      - name: Deploy files
        run: |
          ssh prod <<'EOF'

            set -e

            APP_DIR="/home/ubuntu/EnChat"

            echo "Removing old application..."

            rm -rf "$APP_DIR"/*

            echo "Extracting new application..."

            tar -xzf /tmp/enchat-deploy.tar.gz -C "$APP_DIR"

            echo "Cleaning temporary file..."

            rm -f /tmp/enchat-deploy.tar.gz

            echo "Deployment complete!"

          EOF


